<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img"
     aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">La misma vela, dos formas de contarla: ganada o perdida según la regla del backtest</title>
  <desc id="d">Una vela cuya mecha toca el objetivo por arriba y el stop por abajo. Contada con la
  regla optimista (gana al tocar el objetivo, pierde solo si el cierre pasa el stop) sale ganada.
  Contada de forma simétrica (pierde al tocar el stop, y si toca los dos cuenta como pérdida) sale
  perdida. Sobre 22.908 rupturas del Nasdaq, esa diferencia cambia el resultado de más 0,435R a
  menos 0,328R por operación.</desc>
  <rect width="800" height="470" fill="#10121A"/>
  <text x="48" y="50" fill="#ECE9E1" font-size="25" font-weight="700">La misma vela, contada de dos maneras</text>
  <text x="48" y="78" fill="#8C8E96" font-size="15">Una mecha que toca el objetivo y el stop. ¿Ganada o perdida? Depende de la regla, no del mercado.</text>

  <line x1="48" y1="140" x2="360" y2="140" stroke="#D4AF37" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="48" y="130" fill="#D4AF37" font-size="14">OBJETIVO (+1R)</text>

  <line x1="48" y1="330" x2="360" y2="330" stroke="#C85050" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="48" y="352" fill="#C85050" font-size="14">STOP = el nivel roto (−1R)</text>

  <line x1="200" y1="245" x2="360" y2="245" stroke="#3A3D48" stroke-width="1"/>
  <text x="196" y="241" fill="#8C8E96" font-size="13" text-anchor="end">entrada</text>

  <line x1="250" y1="132" x2="250" y2="338" stroke="#ECE9E1" stroke-width="2"/>
  <rect x="232" y="210" width="36" height="70" fill="#ECE9E1"/>
  <text x="250" y="386" fill="#ECE9E1" font-size="14" text-anchor="middle">una sola vela</text>
  <text x="250" y="406" fill="#8C8E96" font-size="13" text-anchor="middle">toca arriba y abajo</text>

  <rect x="420" y="112" width="332" height="118" rx="6" fill="#171A24" stroke="#4AAA8C" stroke-width="2"/>
  <text x="444" y="142" fill="#4AAA8C" font-size="17" font-weight="700">Como lo contaba yo: GANADA</text>
  <text x="444" y="170" fill="#ECE9E1" font-size="14">Gana al TOCAR el objetivo.</text>
  <text x="444" y="192" fill="#ECE9E1" font-size="14">Pierde solo si una vela CIERRA pasado el stop.</text>
  <text x="444" y="216" fill="#8C8E96" font-size="13">Tocar el stop y volver: sigue viva.</text>

  <rect x="420" y="250" width="332" height="118" rx="6" fill="#171A24" stroke="#C85050" stroke-width="2"/>
  <text x="444" y="280" fill="#C85050" font-size="17" font-weight="700">Medido simétrico: PERDIDA</text>
  <text x="444" y="308" fill="#ECE9E1" font-size="14">Pierde al TOCAR el stop.</text>
  <text x="444" y="330" fill="#ECE9E1" font-size="14">Si una vela toca los dos, cuenta como pérdida.</text>
  <text x="444" y="354" fill="#8C8E96" font-size="13">No sé cuál llegó antes, así que asumo lo peor.</text>

  <line x1="48" y1="424" x2="752" y2="424" stroke="#3A3D48" stroke-width="1"/>
  <text x="48" y="450" fill="#ECE9E1" font-size="15">Sobre 22.908 rupturas del Nasdaq, esa sola diferencia lleva el resultado de</text>
  <text x="596" y="450" fill="#D4AF37" font-size="15" font-weight="700">+0,435R a −0,328R.</text>
</svg>
