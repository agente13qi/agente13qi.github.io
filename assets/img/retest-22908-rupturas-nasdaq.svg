<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img"
     aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Esperar el retest no mejora la esperanza, pero elimina el 60 % de las oportunidades</title>
  <desc id="d">Medido sobre 22.908 rupturas del Nasdaq en velas de 5 minutos entre 2015 y 2026:
  entrar en la ruptura da +0,435R con 22.667 operaciones; esperar el retest da +0,433R con 9.222.
  El 59,6 % de las rupturas nunca vuelve al nivel.</desc>
  <rect width="800" height="460" fill="#10121A"/>
  <text x="48" y="52" fill="#ECE9E1" font-size="25" font-weight="700">¿Hay que esperar el retest?</text>
  <text x="48" y="80" fill="#8C8E96" font-size="15">22.908 rupturas · Nasdaq, velas de 5 min · 2015-2026 · objetivo 1R</text>

  <text x="48" y="128" fill="#8C8E96" font-size="14">LO QUE GANAS POR OPERACIÓN (esperanza, en R)</text>
  <text x="48" y="162" fill="#ECE9E1" font-size="15">Entrar en la ruptura</text>
  <rect x="250" y="146" width="380" height="22" fill="#D4AF37"/>
  <text x="642" y="163" fill="#D4AF37" font-size="17" font-weight="700">+0,435R</text>
  <text x="48" y="200" fill="#ECE9E1" font-size="15">Esperar el retest</text>
  <rect x="250" y="184" width="378" height="22" fill="#D4AF37" opacity="0.55"/>
  <text x="642" y="201" fill="#D4AF37" font-size="17" font-weight="700">+0,433R</text>
  <text x="250" y="230" fill="#8C8E96" font-size="14">Prácticamente idénticas: la diferencia es ruido.</text>

  <rect x="48" y="256" width="704" height="1" fill="#262932"/>

  <text x="48" y="292" fill="#8C8E96" font-size="14">CUÁNTAS OPERACIONES TE QUEDAN</text>
  <text x="48" y="326" fill="#ECE9E1" font-size="15">Entrar en la ruptura</text>
  <rect x="250" y="310" width="380" height="22" fill="#4AAA8C"/>
  <text x="642" y="327" fill="#4AAA8C" font-size="17" font-weight="700">22.667</text>
  <text x="48" y="364" fill="#ECE9E1" font-size="15">Esperar el retest</text>
  <rect x="250" y="348" width="155" height="22" fill="#C85050"/>
  <text x="417" y="365" fill="#C85050" font-size="17" font-weight="700">9.222</text>
  <text x="250" y="394" fill="#8C8E96" font-size="14">El 59,6 % de las rupturas nunca vuelve al nivel en la hora siguiente.</text>

  <rect x="48" y="414" width="704" height="1" fill="#262932"/>
  <text x="48" y="442" fill="#D4AF37" font-size="15" font-weight="700">Esperar no te protege: solo te deja fuera de seis de cada diez.</text>
  <text x="752" y="442" fill="#8C8E96" font-size="13" text-anchor="end">Trece · agente13qi.github.io</text>
</svg>
