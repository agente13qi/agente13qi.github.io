<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"
     aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Vuelta a la Zona: indicador de TradingView de compra y venta en zonas de giro</title>
  <desc id="d">Ilustración: el precio sube hasta un extremo y el indicador guarda una zona naranja; el precio se aleja, vuelve a la
  zona, la rechaza y aparece un cartel de VENTA. Más abajo, una zona de compra verde azulado espera la vuelta del precio.</desc>
  <rect width="800" height="450" fill="#10121A"/>
  <text x="40" y="46" fill="#ECE9E1" font-size="26" font-weight="700">Vuelta a la Zona</text>
  <text x="40" y="72" fill="#8C8E96" font-size="15">Espera al extremo, deja que el precio se vaya y avisa cuando vuelve y lo rechaza</text>

  <!-- zona de venta (ya dio señal: roja) -->
  <rect x="235" y="112" width="330" height="26" fill="#C85050" fill-opacity="0.22" stroke="#C85050" stroke-width="1.5"/>
  <!-- zona de compra esperando (verde azulado, abierta a la derecha) -->
  <rect x="470" y="352" width="300" height="24" fill="#2BA3A0" fill-opacity="0.2" stroke="#2BA3A0" stroke-width="1.5"/>
  <!-- media -->
  <path d="M40 300 C 200 270, 350 250, 500 262 S 700 300, 770 292" fill="none" stroke="#ECE9E1" stroke-width="2" stroke-opacity="0.6"/>

  <!-- velas: subida al extremo, se aleja, vuelve, rechaza, cae -->
  <g stroke-width="2">
    <line x1="70"  y1="262" x2="70"  y2="300" stroke="#4AAA8C"/><rect x="62"  y="270" width="16" height="22" fill="#4AAA8C"/>
    <line x1="100" y1="230" x2="100" y2="276" stroke="#4AAA8C"/><rect x="92"  y="238" width="16" height="30" fill="#4AAA8C"/>
    <line x1="130" y1="195" x2="130" y2="244" stroke="#4AAA8C"/><rect x="122" y="202" width="16" height="36" fill="#4AAA8C"/>
    <line x1="160" y1="160" x2="160" y2="210" stroke="#4AAA8C"/><rect x="152" y="168" width="16" height="36" fill="#4AAA8C"/>
    <line x1="190" y1="130" x2="190" y2="176" stroke="#4AAA8C"/><rect x="182" y="138" width="16" height="32" fill="#4AAA8C"/>
    <line x1="220" y1="112" x2="220" y2="150" stroke="#4AAA8C"/><rect x="212" y="120" width="16" height="22" fill="#4AAA8C"/>
    <line x1="250" y1="118" x2="250" y2="170" stroke="#C85050"/><rect x="242" y="126" width="16" height="36" fill="#C85050"/>
    <line x1="280" y1="150" x2="280" y2="205" stroke="#C85050"/><rect x="272" y="158" width="16" height="40" fill="#C85050"/>
    <line x1="310" y1="185" x2="310" y2="232" stroke="#C85050"/><rect x="302" y="192" width="16" height="32" fill="#C85050"/>
    <line x1="340" y1="178" x2="340" y2="226" stroke="#4AAA8C"/><rect x="332" y="186" width="16" height="32" fill="#4AAA8C"/>
    <line x1="370" y1="150" x2="370" y2="196" stroke="#4AAA8C"/><rect x="362" y="158" width="16" height="30" fill="#4AAA8C"/>
    <line x1="400" y1="104" x2="400" y2="164" stroke="#C85050"/><rect x="392" y="134" width="16" height="24" fill="#C85050"/>
    <line x1="430" y1="140" x2="430" y2="200" stroke="#C85050"/><rect x="422" y="148" width="16" height="44" fill="#C85050"/>
    <line x1="460" y1="185" x2="460" y2="250" stroke="#C85050"/><rect x="452" y="192" width="16" height="50" fill="#C85050"/>
    <line x1="490" y1="235" x2="490" y2="300" stroke="#C85050"/><rect x="482" y="242" width="16" height="50" fill="#C85050"/>
    <line x1="520" y1="285" x2="520" y2="350" stroke="#C85050"/><rect x="512" y="292" width="16" height="50" fill="#C85050"/>
    <line x1="550" y1="330" x2="550" y2="378" stroke="#C85050"/><rect x="542" y="338" width="16" height="30" fill="#C85050"/>
    <line x1="580" y1="310" x2="580" y2="360" stroke="#4AAA8C"/><rect x="572" y="318" width="16" height="34" fill="#4AAA8C"/>
    <line x1="610" y1="285" x2="610" y2="330" stroke="#4AAA8C"/><rect x="602" y="292" width="16" height="30" fill="#4AAA8C"/>
  </g>
  <circle cx="220" cy="100" r="3.5" fill="#E8913A"/><circle cx="550" cy="390" r="3.5" fill="#2BA3A0"/>

  <!-- cartel de VENTA en la vuelta -->
  <rect x="368" y="70" width="64" height="24" rx="4" fill="#C85050"/>
  <text x="400" y="87" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">VENTA</text>
  <path d="M400 94 L394 100 L406 100 Z" fill="#C85050"/>

  <g font-size="13" fill="#8C8E96">
    <text x="40" y="408">1. Extremo → se guarda la zona</text>
    <text x="270" y="408">2. El precio se aleja y vuelve</text>
    <text x="500" y="408">3. La rechaza → aviso</text>
  </g>
  <text x="40" y="432" fill="#6E7078" font-size="12">Ilustración, no datos reales. No es una señal de inversión.</text>
</svg>
